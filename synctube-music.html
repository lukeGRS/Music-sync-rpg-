<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0a0c0b">
<title>SyncTube Music</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='12' cy='16' r='9' fill='%2322e58b'/%3E%3Ccircle cx='20' cy='16' r='9' fill='%2322e58b' fill-opacity='.55'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0a0c0b;--bg2:#101311;--panel:#151916;--panel2:#1c211d;--hover:#222823;--line:#272e29;
  --text:#eef3ef;--mute:#9aa59d;--dim:#6b766e;--acc:#22e58b;--acc2:#12b86c;--accfg:#04150c;
  --warn:#ffb84d;--bad:#ff5d6c;--shadow:0 12px 40px rgba(0,0,0,.45);--r:12px;
  --side:236px;--bar:88px;--nav:0px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f4f6f4;--bg2:#ebefec;--panel:#ffffff;--panel2:#f0f3f1;--hover:#e5eae6;--line:#d9dfda;
  --text:#101512;--mute:#56625a;--dim:#7d8981;--acc:#0fb36a;--acc2:#0a9658;--accfg:#ffffff;
  --shadow:0 12px 40px rgba(20,40,30,.18);color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.4}
a{color:var(--acc)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.f{fill:currentColor;stroke:none}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;border:2px solid transparent;background-clip:content-box}::-webkit-scrollbar-thumb:hover{background:var(--dim);background-clip:content-box;border:2px solid transparent}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}

/* layout */
#app{display:grid;grid-template-columns:var(--side) 1fr;grid-template-rows:1fr var(--bar);height:100%;gap:8px;padding:8px}
#side{grid-row:1;background:var(--panel);border-radius:var(--r);padding:18px 12px;display:flex;flex-direction:column;gap:6px;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.3px;padding:2px 10px 14px}
.logo svg{width:30px;height:30px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:10px;color:var(--mute);font-weight:600;text-align:left;transition:.15s}
.nav button:hover{color:var(--text);background:var(--hover)}
.nav button.on{color:var(--text);background:var(--panel2)}
.nav button.on svg{color:var(--acc)}
.nav .badge{margin-left:auto;background:var(--acc);color:var(--accfg);border-radius:20px;font-size:11px;font-weight:800;padding:1px 7px}
.nav .live{margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 0 var(--acc);animation:pulse 1.8s infinite}
.side-sep{height:1px;background:var(--line);margin:10px 8px}
.side-h{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--dim);padding:6px 12px;font-weight:700}
.side-pl{display:flex;flex-direction:column;gap:2px;overflow:auto}
.side-pl button{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:10px;color:var(--mute);text-align:left}
.side-pl button:hover{background:var(--hover);color:var(--text)}
.side-pl .cv{width:34px;height:34px;border-radius:6px}
.side-pl span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#main{grid-row:1;background:linear-gradient(180deg,var(--bg2),var(--panel) 280px);border-radius:var(--r);overflow:auto;position:relative}
#view{padding:24px 28px 40px;max-width:1500px;margin:auto}
#bar{grid-column:1/-1;grid-row:2;background:var(--panel);border-radius:var(--r);display:grid;grid-template-columns:minmax(170px,1fr) minmax(280px,1.7fr) minmax(280px,1.15fr);align-items:center;gap:16px;padding:0 16px;position:relative}

/* tipografia / blocos */
h1{font-size:30px;letter-spacing:-.6px;font-weight:800}
h2{font-size:20px;letter-spacing:-.3px;font-weight:800}
h3{font-size:15px;font-weight:700}
.sub{color:var(--mute)}
.mute{color:var(--mute)}.dim{color:var(--dim)}
.sec{margin-top:30px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;gap:12px}
.sec-h a,.link{color:var(--mute);font-weight:600;font-size:13px;cursor:pointer;text-decoration:none;background:none;border:0}
.sec-h a:hover,.link:hover{color:var(--text);text-decoration:underline}
.page-h{display:flex;align-items:flex-end;gap:22px;margin-bottom:22px;flex-wrap:wrap}
.page-h .cv{width:190px;height:190px;border-radius:10px;box-shadow:var(--shadow)}
.page-h .meta{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1}
.page-h .kind{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--mute)}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:34px;text-align:center;color:var(--mute);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty svg{width:34px;height:34px;color:var(--dim)}

/* botões */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;font-weight:700;background:var(--panel2);border:1px solid var(--line);transition:.15s;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--hover);transform:translateY(-1px)}
.btn.pri{background:var(--acc);color:var(--accfg);border-color:transparent}
.btn.pri:hover:not(:disabled){background:var(--acc2)}
.btn.bad{color:var(--bad)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.ghost{background:none;border-color:transparent;color:var(--mute)}
.btn.ghost:hover:not(:disabled){color:var(--text);background:var(--hover)}
.ib{width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;color:var(--mute);transition:.12s;flex:none}
.ib:hover:not(:disabled){color:var(--text);background:var(--hover)}
.ib.on{color:var(--acc)}
.ib.fav.on{color:var(--acc)}
.ib.fav.on svg{fill:currentColor}
.big-play{width:56px;height:56px;border-radius:50%;background:var(--acc);color:var(--accfg);display:grid;place-items:center;transition:.15s;flex:none}
.big-play:hover:not(:disabled){transform:scale(1.06);background:var(--acc2)}
.big-play svg{width:26px;height:26px}

/* capas */
.cv{background:var(--panel2) center/cover no-repeat;display:grid;place-items:center;color:rgba(255,255,255,.75);flex:none;position:relative;overflow:hidden;border-radius:8px}
.cv svg{width:42%;height:42%;opacity:.8}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cv.pl{background-image:none}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:16px}
.card{background:var(--panel2);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;cursor:pointer;position:relative;transition:.18s;min-width:0;text-align:left}
.card:hover{background:var(--hover);transform:translateY(-2px)}
.card .cv{width:100%;aspect-ratio:1;border-radius:8px}
.card .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .s{color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .pp{position:absolute;right:20px;top:calc(100% - 82px);opacity:0;transform:translateY(8px);transition:.18s;width:44px;height:44px;border-radius:50%;background:var(--acc);color:var(--accfg);display:grid;place-items:center;box-shadow:var(--shadow)}
.card:hover .pp,.card:focus-within .pp{opacity:1;transform:none}
@media (hover:none){.card .pp{opacity:1;transform:none}}

/* lista de faixas */
.tl{display:flex;flex-direction:column}
.tl-h,.tr{display:grid;grid-template-columns:36px minmax(0,6fr) minmax(0,3fr) minmax(0,2fr) 56px 36px 36px;gap:12px;align-items:center;padding:6px 10px;border-radius:8px}
.tl-h{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--line);border-radius:0;padding-bottom:8px;margin-bottom:6px;font-weight:700}
.tr{transition:background .1s;position:relative}
.tr:hover{background:var(--panel2)}
.tr.cur{background:var(--panel2)}
.tr.cur .tt{color:var(--acc)}
.tr.drag-over{box-shadow:0 -2px 0 var(--acc)}
.tr.dragging{opacity:.4}
.tr .n{color:var(--dim);text-align:center;position:relative;height:36px;display:grid;place-items:center}
.tr .n .num{display:block}.tr .n .pl{display:none}
.tr:hover .n .num,.tr:hover .n .eq{display:none}.tr:hover .n .pl{display:grid}
.tr .n button{position:absolute;inset:0;margin:auto;width:32px;height:32px;border-radius:50%;place-items:center;color:var(--text)}
.tr .info{display:flex;align-items:center;gap:12px;min-width:0}
.tr .info .cv{width:40px;height:40px;border-radius:5px}
.tr .tt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.tr .ar{color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.tr .al,.tr .da{color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .du{color:var(--mute);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.tr .src{display:inline-block;font-size:10px;font-weight:800;padding:0 5px;border-radius:4px;background:var(--hover);color:var(--mute);margin-left:6px;vertical-align:1px;letter-spacing:.4px}
.tr .ib{opacity:.0}.tr:hover .ib,.tr .ib.on,.tr:focus-within .ib{opacity:1}
@media (hover:none){.tr .ib{opacity:1}}
.eq{display:flex;gap:2px;align-items:flex-end;height:14px}
.eq i{width:3px;background:var(--acc);border-radius:2px;animation:eq 1s ease-in-out infinite;height:30%}
.eq i:nth-child(2){animation-delay:-.4s}.eq i:nth-child(3){animation-delay:-.7s}
.eq.paused i{animation-play-state:paused}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--acc) 60%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .9s linear infinite}

/* player */
.np{display:flex;align-items:center;gap:12px;min-width:0}
.np .cv{width:56px;height:56px;border-radius:6px}
.np .tx{min-width:0}
.np .tt{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np .ar{color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc{display:flex;flex-direction:column;align-items:center;gap:6px}
.pc-b{display:flex;align-items:center;gap:10px}
.pc-p{display:flex;align-items:center;gap:10px;width:100%}
.pc-p span{font-size:12px;color:var(--mute);width:42px;font-variant-numeric:tabular-nums}
.pc-p span:first-child{text-align:right}
.pr{position:relative;flex:1;height:14px;display:flex;align-items:center}
.pr .trk{position:absolute;left:0;right:0;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.pr .fill{position:absolute;left:0;top:0;bottom:0;background:var(--text);width:0}
.pr:hover .fill{background:var(--acc)}
.pr .xfz{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--acc) 70%,transparent) 0 3px,transparent 3px 6px);right:0;width:0}
.pr input{position:absolute;inset:0;width:100%;opacity:0;cursor:pointer;margin:0}
.pr input:disabled{cursor:default}
.pr .knob{position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;top:1px;margin-left:-6px;opacity:0;pointer-events:none;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.pr:hover .knob{opacity:1}
.pb-r{display:flex;align-items:center;justify-content:flex-end;gap:8px}
.vol{display:flex;align-items:center;gap:6px;flex:1 1 90px;min-width:80px;max-width:140px}
.pb-r>.syncpill,.pb-r>.xfpill{flex:none}
#fab{position:fixed;right:14px;bottom:calc(var(--bar) + var(--nav) + 14px);width:50px;height:50px;border-radius:50%;padding:0;place-items:center;z-index:35;box-shadow:var(--shadow)}
.vol input{width:100%}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:16px;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--text) var(--p,0%),var(--line) var(--p,0%))}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:var(--line)}
input[type=range]::-moz-range-progress{height:4px;border-radius:4px;background:var(--text)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;margin-top:-4px;box-shadow:0 1px 4px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:#fff}
.vol:hover input[type=range]::-webkit-slider-runnable-track{background:linear-gradient(90deg,var(--acc) var(--p,0%),var(--line) var(--p,0%))}
.xfpill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--panel2);color:var(--mute);border:1px solid var(--line);white-space:nowrap;cursor:pointer}
.xfpill.on{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 50%,transparent)}
.xfpill.act{background:var(--acc);color:var(--accfg);animation:pulse 1.2s infinite}
.syncpill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--panel2);color:var(--mute);border:1px solid var(--line);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);display:inline-block;flex:none}
.dot.ok{background:var(--acc)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}

/* cartão do YouTube */
.yt-card{position:fixed;right:16px;bottom:calc(var(--bar) + 20px);width:320px;height:180px;border-radius:12px;overflow:hidden;box-shadow:var(--shadow);background:#000;z-index:30;transition:opacity .2s}
.yt-card.off{left:-10000px;right:auto;opacity:0}
.yt-card .yt-deck{position:absolute;inset:0}
.yt-card .yt-deck:not(.on){left:-10000px}
.yt-card iframe{width:100%;height:100%;border:0;display:block}
.yt-card .cap{position:absolute;left:0;right:0;top:0;font-size:11px;padding:4px 10px;background:linear-gradient(#000a,transparent);color:#fff;pointer-events:none;z-index:2}

/* formulários */
input[type=text],input[type=url],input[type=search],input:not([type]),select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.5px}
label.f>*:not(:first-child){text-transform:none;letter-spacing:0;font-weight:400;color:var(--text);font-size:14px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:14px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sw:last-child{border:0}
.sw .l{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 230px}
.sw .l small{color:var(--mute);font-size:12px}
.tog{position:relative;width:42px;height:24px;flex:none}
.tog input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0;width:100%;height:100%;z-index:1}
.tog i{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.2s}
.tog i:after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.tog input:checked+i{background:var(--acc)}
.tog input:checked+i:after{transform:translateX(18px)}
.tog input:disabled{cursor:not-allowed}.tog input:disabled+i{opacity:.4}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex-wrap:nowrap;flex:none;max-width:100%}
.seg button{padding:6px 14px;border-radius:99px;font-weight:700;color:var(--mute);font-size:13px;white-space:nowrap}
.seg button.on{background:var(--acc);color:var(--accfg)}
.seg button:disabled{opacity:.5}
.box{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.note{font-size:13px;color:var(--mute);background:var(--panel2);border-left:3px solid var(--acc);padding:10px 14px;border-radius:6px}
.note.warn{border-color:var(--warn)}.note.bad{border-color:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--hover);color:var(--mute)}
.chip.ok{background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc)}
.chip.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.chip.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}

/* modal, menu, toasts */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:100;padding:16px;animation:fade .15s;backdrop-filter:blur(3px)}
@keyframes fade{from{opacity:0}}
.md{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:var(--shadow);animation:pop .18s}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}}
.md-h{display:flex;justify-content:space-between;align-items:center;padding:18px 22px 6px}
.md-b{padding:10px 22px 22px;display:flex;flex-direction:column;gap:14px}
.md-f{display:flex;justify-content:flex-end;gap:10px;padding:0 22px 20px;flex-wrap:wrap}
.menu{position:fixed;z-index:120;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:5px;min-width:210px;box-shadow:var(--shadow);animation:pop .1s}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:7px;text-align:left}
.menu button:hover{background:var(--hover)}
.menu button.bad{color:var(--bad)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bar) + 24px);display:flex;flex-direction:column;gap:8px;z-index:200;align-items:center;pointer-events:none;width:min(480px,92vw)}
.toast{background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;box-shadow:var(--shadow);animation:pop .18s;pointer-events:auto;max-width:100%}
.toast.bad{background:var(--bad);color:#fff}.toast.ok{background:var(--acc);color:var(--accfg)}
#reqs{position:fixed;top:16px;right:16px;display:flex;flex-direction:column;gap:10px;z-index:150;width:min(340px,92vw)}
.req{background:var(--panel);border:1px solid var(--acc);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;animation:pop .2s}
#unlock{position:fixed;left:50%;transform:translateX(-50%);top:14px;z-index:160;display:none}
#unlock.on{display:flex}
.bn{display:none}
.pickrow{display:flex;align-items:center;gap:12px;padding:8px;border-radius:8px;cursor:pointer}
.pickrow:hover{background:var(--hover)}
.pickrow input{width:18px;height:18px;accent-color:var(--acc)}
.pickrow .cv{width:40px;height:40px;border-radius:5px}
.pickrow .tx{min-width:0;flex:1}
.pickrow .tx b,.pickrow .tx small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pickrow small{color:var(--mute)}
.pickwrap{max-height:300px;overflow:auto;margin:0 -8px}
.preview{display:flex;gap:14px;padding:12px;background:var(--panel2);border-radius:12px;align-items:center}
.preview .cv{width:84px;height:84px;border-radius:8px}
.preview .col{flex:1;min-width:0;gap:8px}
.spinner{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite;display:inline-block}

/* sala */

<noscript>Este app precisa de JavaScript.</noscript>
<script>/* SyncTube Music — núcleo puro (sem DOM): estado da sala, relógio, deriva, fontes, ID3 */
(function (root) {
'use strict';

const LEAD_MS = 300;          // antecedência dada a play/seek para todos começarem juntos
const MANUAL_FADE = 0.4;      // fade curto ao pular faixa manualmente
const FADE_OPTIONS = [0, 3, 5, 8, 10, 12];
const MAX_QUEUE = 300;

/* ---------- utilidades ---------- */
function rid(n = 8) {
  const a = 'abcdefghijklmnopqrstuvwxyz0123456789'; let s = '';
  for (let i = 0; i < n; i++) s += a[Math.floor(Math.random() * a.length)];
  return s;
}
const CODE_ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function genCode(len = 6) {
  let s = ''; for (let i = 0; i < len; i++) s += CODE_ALPHABET[Math.floor(Math.random() * CODE_ALPHABET.length)];
  return s;
}
function normCode(s) { return String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 12); }
function cleanStr(s, max) {
  if (typeof s !== 'string') return '';
  return s.replace(/[\u0000-\u001f\u007f]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, max);
}
function num(n, lo, hi) { n = Number(n); return isFinite(n) ? Math.min(hi, Math.max(lo, n)) : 0; }
function fmtTime(sec) {
  if (!isFinite(sec) || sec < 0) sec = 0; sec = Math.floor(sec);
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return h ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : `${m}:${String(s).padStart(2, '0')}`;
}
function hash32(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return (h >>> 0).toString(16).padStart(8, '0');
}
function hueOf(str) { return parseInt(hash32(String(str)).slice(0, 4), 16) % 360; }

/* ---------- validação de dados vindos da rede ---------- */
function safeHttpUrl(u) {
  if (typeof u !== 'string' || u.length > 2000) return '';
  try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch { return ''; }
}
function safeCover(c) {
  if (typeof c !== 'string' || !c) return '';
  if (/^data:image\/(png|jpeg|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(c) && c.length <= 40000) return c;
  return c.length <= 1000 ? safeHttpUrl(c) : '';
}
function sanitizeTrack(t) {
  if (!t || typeof t !== 'object') return null;
  const source = t.source === 'youtube' ? 'youtube' : t.source === 'direct' ? 'direct' : null;
  if (!source) return null;
  const out = {
    source,
    title: cleanStr(t.title, 200) || 'Sem título',
    artist: cleanStr(t.artist, 120) || 'Artista desconhecido',
    album: cleanStr(t.album, 120),
    cover: safeCover(t.cover),
    duration: num(t.duration, 0, 86400 * 3),
  };
  if (source === 'youtube') {
    if (!/^[\w-]{11}$/.test(t.sourceId || '')) return null;
    out.sourceId = t.sourceId; out.url = 'https://www.youtube.com/watch?v=' + t.sourceId; out.id = 'y:' + t.sourceId;
  } else {
    const u = safeHttpUrl(t.url); if (!u) return null;
    out.url = u; out.id = 'd:' + hash32(u);
  }
  return out;
}

/* ---------- identificação de links ---------- */
const UNSUPPORTED = [
  [/(^|\.)spotify\.com$|^spotify\.link$/, 'Spotify', 'O Spotify só permite tocar dentro dos seus próprios apps (o SDK exige login Premium e não aceita reprodução por link em outros players).'],
  [/(^|\.)deezer\.com$|^deezer\.page\.link$/, 'Deezer', 'O Deezer só libera trechos de 30 s por API pública; não há reprodução completa por link.'],
  [/(^|\.)music\.apple\.com$/, 'Apple Music', 'O Apple Music exige MusicKit com assinatura e login; não toca por link direto.'],
  [/(^|\.)tidal\.com$/, 'Tidal', 'O Tidal não oferece reprodução por link fora dos seus apps.'],
  [/(^|\.)music\.amazon\.[a-z.]+$/, 'Amazon Music', 'O Amazon Music não oferece reprodução por link fora dos seus apps.'],
  [/(^|\.)soundcloud\.com$|^snd\.sc$/, 'SoundCloud', 'O SoundCloud só toca via o Widget oficial, que ainda não está integrado (a arquitetura de fontes já comporta esse adaptador).'],
  [/(^|\.)bandcamp\.com$/, 'Bandcamp', 'O Bandcamp só toca pelo player embutido deles; não há URL de áudio direta.'],
];
const AUDIO_EXT = /\.(mp3|ogg|oga|opus|wav|flac|m4a|aac|weba|webm)$/i;

function parseYouTubeId(u) {
  const host = u.hostname.replace(/^www\./, '').toLowerCase();
  const ok = (id) => (/^[\w-]{11}$/.test(id || '') ? id : null);
  if (host === 'youtu.be') return ok(u.pathname.split('/')[1]);
  if (host === 'youtube.com' || host === 'm.youtube.com' || host === 'music.youtube.com' || host === 'youtube-nocookie.com') {
    if (u.pathname === '/watch') return ok(u.searchParams.get('v'));
    const m = u.pathname.match(/^\/(embed|shorts|live|v)\/([\w-]{11})/);
    if (m) return m[2];
  }
  return null;
}
function identifyUrl(raw) {
  let s = String(raw || '').trim();
  if (!s) return { status: 'empty' };
  if (!/^https?:\/\//i.test(s)) {
    if (/^[\w.-]+\.[a-z]{2,}(\/|$)/i.test(s)) s = 'https://' + s;
    else return { status: 'invalid', reason: 'Isso não parece um link. Cole um endereço começando com http:// ou https://.' };
  }
  let u; try { u = new URL(s); } catch { return { status: 'invalid', reason: 'Link malformado.' }; }
  if (!/^https?:$/.test(u.protocol)) return { status: 'invalid', reason: 'Só links http(s) são aceitos.' };
  const host = u.hostname.replace(/^www\./, '').toLowerCase();
  const yt = parseYouTubeId(u);
  if (yt) return { status: 'ok', platform: 'youtube', label: 'YouTube', id: yt, url: 'https://www.youtube.com/watch?v=' + yt };
  if (/(^|\.)youtube\.com$|^youtu\.be$/.test(host))
    return { status: 'unsupported', platform: 'youtube', label: 'YouTube', reason: 'Esse link do YouTube não aponta para um vídeo específico (playlist, canal ou busca). Cole o link de um vídeo.' };
  for (const [re, label, reason] of UNSUPPORTED) if (re.test(host)) return { status: 'unsupported', platform: label.toLowerCase(), label, reason };
  if (AUDIO_EXT.test(u.pathname)) return { status: 'ok', platform: 'direct', label: 'Áudio direto', url: u.href };
  return { status: 'try', platform: 'direct', label: 'Áudio direto (não confirmado)', url: u.href,
    reason: 'Não reconheci a extensão; vou tentar carregar o link como arquivo de áudio.' };
}

/* ---------- ID3v2 (título, artista, álbum, capa) ---------- */
function parseId3(buf) {
  const b = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
  if (b.length < 10 || b[0] !== 0x49 || b[1] !== 0x44 || b[2] !== 0x33) return null;
  const ver = b[3];
  if (ver !== 3 && ver !== 4) return null;
  const sync = (o) => ((b[o] & 0x7f) << 21) | ((b[o + 1] & 0x7f) << 14) | ((b[o + 2] & 0x7f) << 7) | (b[o + 3] & 0x7f);
  const be = (o) => ((b[o] << 24) | (b[o + 1] << 16) | (b[o + 2] << 8) | b[o + 3]) >>> 0;
  const end = Math.min(b.length, 10 + sync(6));
  let off = 10;
  if (b[5] & 0x40) off += ver === 4 ? sync(off) : be(off) + 4;
  const dec = (enc, bytes) => {
    let label = 'iso-8859-1';
    if (enc === 3) label = 'utf-8';
    else if (enc === 1) {
      if (bytes[0] === 0xff && bytes[1] === 0xfe) { label = 'utf-16le'; bytes = bytes.subarray(2); }
      else if (bytes[0] === 0xfe && bytes[1] === 0xff) { label = 'utf-16be'; bytes = bytes.subarray(2); }
      else label = 'utf-16le';
    } else if (enc === 2) label = 'utf-16be';
    return new TextDecoder(label).decode(bytes).replace(/\u0000/g, '').trim();
  };
  const out = {};
  while (off + 10 <= end) {
    if (b[off] === 0) break;
    const id = String.fromCharCode(b[off], b[off + 1], b[off + 2], b[off + 3]);
    const size = ver === 4 ? sync(off + 4) : be(off + 4);
    const body = off + 10;
    if (size <= 0 || body + size > b.length) break;
    if (id === 'TIT2') out.title = dec(b[body], b.subarray(body + 1, body + size));
    else if (id === 'TPE1') out.artist = dec(b[body], b.subarray(body + 1, body + size));
    else if (id === 'TALB') out.album = dec(b[body], b.subarray(body + 1, body + size));
    else if (id === 'APIC' && !out.cover) {
      const enc = b[body]; let p = body + 1; let q = p;
      while (q < body + size && b[q] !== 0) q++;
      const mime = String.fromCharCode(...b.subarray(p, q)); p = q + 2; // fim do mime + tipo da imagem
      if (enc === 1 || enc === 2) { while (p + 1 < body + size && !(b[p] === 0 && b[p + 1] === 0)) p += 2; p += 2; }
      else { while (p < body + size && b[p] !== 0) p++; p += 1; }
      if (p < body + size) out.cover = { mime: /^image\//.test(mime) ? mime : 'image/jpeg', data: b.slice(p, body + size) };
    }
    off = body + size;
  }
  return out;
}

/* ---------- relógio compartilhado (NTP simplificado) ---------- */
class ClockSync {
  constructor() { this.samples = []; this.offset = 0; this.rtt = null; this.ready = false; }
  addSample(t0, ts, t1) {
    const rtt = t1 - t0;
    if (rtt < 0 || rtt > 5000) return;
    this.samples.push({ rtt, offset: ts - (t0 + t1) / 2 });
    if (this.samples.length > 12) this.samples.shift();
    const best = [...this.samples].sort((a, b) => a.rtt - b.rtt).slice(0, 3);
    const offs = best.map((s) => s.offset).sort((a, b) => a - b);
    this.offset = offs[Math.floor(offs.length / 2)];
    this.rtt = best[0].rtt; this.ready = true;
  }
  // estimativa provisória (sem RTT conhecido): só vale até chegar a primeira amostra de ping real
  provisional(serverMs, local = Date.now()) { if (this.samples.length) return; this.offset = serverMs - local; this.ready = true; }
  serverNow(local = Date.now()) { return local + this.offset; }
  toLocal(serverMs) { return serverMs - this.offset; }
}

/* ---------- correção de deriva ---------- */
// drift = posição real − posição esperada (s). Retorna {rate} ou {seek:true}.
function driftAction(drift, correcting = false, fineRate = true) {
  const a = Math.abs(drift);
  if (!fineRate) return a > 0.25 ? { seek: true } : { rate: 1 };
  if (a > 0.6) return { seek: true };
  if (a < (correcting ? 0.012 : 0.04)) return { rate: 1 };            // histerese: entra em 40 ms, sai em 12 ms
  return { rate: 1 - Math.sign(drift) * Math.min(0.06, 0.02 + a * 0.08), correcting: true };
}

/* ---------- Sala: estado autoritativo ---------- */
function colorFor(id) { return `hsl(${hueOf(id)} 65% 55%)`; }

class Room {
  constructor(opts = {}, rnd = Math.random) {
    this.rnd = rnd;
    this.hostId = opts.hostId || 'host';
    this.settings = {
      name: cleanStr(opts.name, 60) || 'Sessão local',
      code: opts.code || genCode(),
      visibility: opts.visibility === 'public' ? 'public' : 'private',
      mode: opts.mode === 'collab' ? 'collab' : 'host',
      guestsControl: !!opts.guestsControl,
      fade: FADE_OPTIONS.includes(opts.fade) ? opts.fade : 5,
    };
    this.queue = []; this.index = -1; this.playing = false; this.pos = 0; this.anchor = 0; this.v = 0;
    this.shuffle = false; this.repeat = 'off';
    this.xf = null; this.pendingNext = null; this.played = new Set(); this.back = [];
    this.members = new Map(); this.chat = [];
  }

  /* --- consultas --- */
  cur() { return this.queue[this.index] || null; }
  dur(t) { return t ? t.duration || 0 : 0; }
  position(now) { return this.playing ? this.pos + Math.max(0, (now - this.anchor) / 1000) : this.pos; }
  isHost(id) { return id === this.hostId; }
  canControl(id) { return this.isHost(id) || (this.settings.mode === 'collab' && this.settings.guestsControl); }
  canEnqueue(id) { return this.isHost(id) || this.settings.mode === 'collab'; }
  indexOfQid(qid) { return this.queue.findIndex((q) => q.qid === qid); }

  /* próximo índice (sem efeitos além de fixar o sorteio do shuffle) */
  planNext() {
    const n = this.queue.length; if (!n) return -1;
    if (this.repeat === 'one') return this.index;
    if (this.shuffle) {
      const pi = this.pendingNext ? this.indexOfQid(this.pendingNext) : -1;
      if (pi >= 0 && pi !== this.index) return pi;
      let pool = []; for (let i = 0; i < n; i++) if (i !== this.index && !this.played.has(this.queue[i].qid)) pool.push(i);
      if (!pool.length && this.repeat === 'all' && n > 1) {
        this.played = new Set([this.queue[this.index].qid]);   // novo ciclo
        for (let i = 0; i < n; i++) if (i !== this.index) pool.push(i);
      }
      if (!pool.length) return -1;
      const pick = pool[Math.floor(this.rnd() * pool.length)];
      this.pendingNext = this.queue[pick].qid; return pick;
    }
    if (this.index + 1 < n) return this.index + 1;
    return this.repeat === 'all' ? 0 : -1;
  }
  effFade() {
    const d = this.dur(this.cur()); let f = this.settings.fade;
    if (d) f = Math.min(f, d / 2);
    return f;
  }
  nextInfo() {
    if (!this.playing) return null;
    const t = this.cur(); const d = this.dur(t); if (!t || !d || this.repeat === 'one') return null;
    const ni = this.planNext(); if (ni < 0) return null;
    let fade = this.effFade();
    let startAt = this.anchor + (d - fade - this.pos) * 1000;
    if (startAt < this.anchor) { startAt = this.anchor; fade = Math.max(0, Math.min(fade, d - this.pos)); }
    return { qid: this.queue[ni].qid, track: this.pubItem(this.queue[ni]), startAt, fade };
  }

  /* --- mutações --- */
  goTo(idx, now, o = {}) {
    const { auto = false, at = now, fade = 0, play = true, startPos = 0, noBack = false } = o;
    const prev = this.cur();
    if (prev && !noBack) { this.back.push(prev.qid); if (this.back.length > 50) this.back.shift(); }
    this.index = idx; const t = this.cur();
    this.played.add(t.qid);
    this.pendingNext = null;
    this.pos = startPos; this.playing = play;
    this.anchor = auto ? at : now + (play ? LEAD_MS : 0);
    this.xf = fade > 0 && prev ? { fade, from: prev.qid, start: this.anchor, until: this.anchor + fade * 1000, manual: !auto } : null;
    this.v++;
  }
  tick(now) {
    if (!this.playing || this.index < 0) return false;
    const t = this.cur(); const d = this.dur(t); if (!d) return false;
    const p = this.position(now);
    if (this.repeat === 'one') {
      if (p >= d) { this.pos = 0; this.anchor = now; this.xf = null; this.v++; return true; }
      return false;
    }
    const ni = this.planNext();
    if (ni < 0) { if (p >= d) { this.playing = false; this.pos = 0; this.xf = null; this.v++; return true; } return false; }
    const info = this.nextInfo();
    if (info && now >= info.startAt) { this.goTo(ni, now, { auto: true, at: info.startAt, fade: info.fade }); return true; }
    return false;
  }
  _removeAt(i, now) {
    const wasCur = i === this.index; const [it] = this.queue.splice(i, 1);
    this.played.delete(it.qid); if (this.pendingNext === it.qid) this.pendingNext = null;
    this.back = this.back.filter((q) => q !== it.qid);

/* =====================================================================

class HostSession {
  constructor({ engine, myId, name, fade = 5, hooks = {} }) {
    this.type = 'host'; this.engine = engine; this.myId = myId; this.name = name; this.hooks = hooks;
    this.room = new Room({ hostId: myId, name: 'Sessão local', fade });

      onDuration: (track, d) => this.dispatch({ type: 'dur', id: track.id, d }),

    const msg = this.room.addChat(this.myId, text, Date.now());
    if (msg) { this._broadcast({ t: 'chat', m: msg }); if (this.hooks.onChat) this.hooks.onChat(msg); }
  }

}

/* =====================================================================
   GuestSession: entra na sala de alguém. Estima o relógio do servidor, segue o estado,
   reconecta sozinho se a conexão cair.
   ===================================================================== */
class GuestSession {
  constructor({ engine, code, myId, name, token, hooks = {}, allowPeer = true }) {
    this.type = 'guest'; this.engine = engine; this.code = code; this.myId = myId; this.name = name; this.token = token;

      onStatus: () => this._sendStatus(),

      onTrackStart: (t) => hooks.onTrackStart && hooks.onTrackStart(t),

  }

  state_() { return this.S; }

  canControl() { return !!(this.S && this.S.settings.mode === 'collab' && this.S.settings.guestsControl); }
  canEnqueue() { return !!(this.S && this.S.settings.mode === 'collab'); }
  _changed() { if (this.hooks.onChange) this.hooks.onChange(); }

  /* retorna 'ok' | 'pending' (aguardando aprovação) ; lança Error se não achou/negado */
  async join() {
    const conn = await root.STNet.connectAny(this.code, this.myId, { allowPeer: this.allowPeer });
    return new Promise((resolve, reject) => {
      this._joinWaiter = { resolve, reject }; this._bind(conn);
      conn.send({ t: 'hello', cid: this.myId, name: this.name, token: this.token });
      this._joinTimer = setTimeout(() => { if (this._joinWaiter && this.state === 'connecting') { this._joinWaiter = null; this._finish('left'); reject(new Error('A sala não respondeu.')); } }, 20000);
    });

        break;

        break;

      case 'chat': this._chat.push(m.m); if (this._chat.length > 100) this._chat.shift(); if (this.hooks.onChat) this.hooks.onChat(m.m); this._changed(); break;

    }
  }
  _startLoops() {

  }

  dispatch(a) {
    if (this.state !== 'ok') return { ok: false, err: 'Sem conexão com a sala.' };
    this._send({ t: 'act', a }); return { ok: true, remote: true };
  }
  sendChat(text) { this._send({ t: 'chat', text }); }

  async _lost() {

  }
  _finish(reason) {
    if (this.closed) return; this.closed = true; this.state = reason === 'closed' ? 'closed' : reason;
    clearInterval(this.pingT); clearInterval(this.statT); clearTimeout(this._joinTimer);

    if (this.hooks.onEnded) this.hooks.onEnded(reason);
  }
  leave() {
    if (this.closed) return;
    this._send({ t: 'bye' }); this._finish('left');
  }
}

    if (id.status === 'invalid') return setStatus('bad', id.reason);
    if (id.status === 'unsupported') return setStatus('bad', `${id.label}: ${id.reason}`);

      let track, note = '';
      if (id.platform === 'youtube') {
        let info;
        try { info = await Sources.probeYouTube(id.id); }
        catch (e) {
          if (e instanceof TypeError) { info = { title: 'Vídeo do YouTube (' + id.id + ')', artist: 'YouTube', cover: 'https://i.ytimg.com/vi/' + id.id + '/hqdefault.jpg' }; note = 'Sem conexão com o YouTube agora: não consegui confirmar o vídeo nem buscar o título. Você pode salvar e editar o nome.'; }
          else throw e;
        }
        track = { source: 'youtube', sourceId: id.id, url: id.url, title: info.title, artist: info.artist || 'YouTube', cover: info.cover, duration: 0 };
      } else {
        const pr = await Sources.probeDirect(id.url); const meta = pr.meta || {};
        let cov = ''; if (meta.cover) { try { cov = await imageToDataUrl(new Blob([meta.cover.data], { type: meta.cover.mime }), 220, 0.8); } catch {} }

        track = { source: 'direct', url: id.url, title: meta.title || fname || 'Faixa sem título', artist: meta.artist || 'Artista desconhecido', album: meta.album || '', cover: cov, duration: pr.duration };
        if (!pr.corsOk) note = 'Este servidor não libera CORS: a música toca normalmente, mas o crossfade usa o controle de volume do elemento de áudio (continua funcionando).';
        if (id.status === 'try') note = (note ? note + ' ' : '') + 'A extensão do link não é de áudio conhecida, mas o arquivo carregou.';
      }
      if (my !== token) return;
      if (id.platform === 'youtube' && fileProto()) note = 'Atenção: você abriu o app direto do arquivo (file://). O YouTube se recusa a tocar assim (erro de “origem”). Você pode salvar a música, mas ela só tocará quando o app for aberto por http(s): servidor local (localhost) ou hospedagem.';
      cur_ = track; setStatus(note ? 'warn' : '', note || (id.platform === 'youtube' ? 'Vídeo encontrado. Compatível com reprodução incorporada.' : 'Áudio carregado com sucesso.'));
      showPreview(track);
