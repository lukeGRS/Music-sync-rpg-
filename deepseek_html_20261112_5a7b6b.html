<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0a0c0b">
  <title>SyncTube Music</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='12' cy='16' r='9' fill='%2322e58b'/%3E%3Ccircle cx='20' cy='16' r='9' fill='%2322e58b' fill-opacity='.55'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <div id="app">
    <aside id="side" aria-label="Navegação">
      <div class="logo">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="12" cy="16" r="9" fill="var(--acc)"/>
          <circle cx="20" cy="16" r="9" fill="var(--acc)" fill-opacity=".5"/>
        </svg>
        SyncTube Music
      </div>
    </aside>
    <main id="main"><div id="view"></div></main>
    <footer id="bar" aria-label="Player"></footer>
  </div>
  <nav class="bn" aria-label="Navegação"></nav>
  <div class="yt-card off" id="ytcard"><div class="cap">YouTube</div></div>
  <div id="unlock">
    <button class="btn pri" style="box-shadow:var(--shadow)">🔊 Toque aqui para ativar o som</button>
  </div>
  <noscript>Este app precisa de JavaScript.</noscript>

  <script src="src/core.js"></script>
  <script src="src/storage.js"></script>
  <script src="src/engine.js"></script>
  <script src="src/net.js"></script>
  <script src="src/session.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
